<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Things to bring</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>Things to bring</h1>
    <p class="intro">Who brings what to our team evening?</p>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <form class="add" action="/add" method="post">
      <input name="a" type="number" step="any" placeholder="First number" required autocomplete="off" autofocus>
      <select name="operator">
        <option value="+">+</option>
        <option value="-">−</option>
        <option value="*">×</option>
        <option value="/">÷</option>
      </select>
      <input name="b" type="number" step="any" placeholder="Second number" required autocomplete="off">
      <button type="submit">Calculate</button>
    </form>

    {% if entries %}
    <table>
      <thead>
        <tr><th>Calculation</th></tr>
      </thead>
      <tbody>
        {% for entry in entries %}
        <tr><td>{{ entry.a }} {{ entry.operator }} {{ entry.b }} = {{ entry.result }}</td></tr>
        {% endfor %}
      </tbody>
    </table>
    {% else %}
    <p class="empty">Nothing here yet.</p>
    {% endif %}
  </main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>Calculator</h1>
    <p class="intro">Enter two numbers and pick an operation.</p>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <form class="add" action="/add" method="post">
      <input name="a" type="number" step="any" placeholder="First number" required autocomplete="off" autofocus>
      <select name="operator">
        <option value="+">+</option>
        <option value="-">−</option>
        <option value="*">×</option>
        <option value="/">÷</option>
      </select>
      <input name="b" type="number" step="any" placeholder="Second number" required autocomplete="off">
      <button type="submit">Calculate</button>
    </form>

    {% if entries %}
    <table>
      <thead>
        <tr><th>First</th><th>Op</th><th>Second</th><th>Result</th></tr>
      </thead>
      <tbody>
        {% for entry in entries %}
        <tr>
          <td>{{ entry.a }}</td>
          <td>{{ entry.operator }}</td>
          <td>{{ entry.b }}</td>
          <td class="result">= {{ entry.result }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    {% else %}
    <p class="empty">No calculations yet.</p>
    {% endif %}
  </main>
</body>
</html>
